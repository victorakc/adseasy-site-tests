<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação Exclusiva - adEasy Hub</title>
    
    <!-- TAG GLOBAL DO GOOGLE ADS & GTM / ANALYTICS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18420984078"></script>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5ZXZK2H5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Configurações das tags globais
      gtag('config', 'AW-18420984078'); // Google Ads
      gtag('config', 'GTM-5ZXZK2H5');   // Analytics / GTM
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(56, 189, 248, 0.15), rgba(2, 6, 23, 1));
        }
        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            width: 100%; 
            border-radius: 0.75rem; 
        }
        .video-container iframe, .video-container video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(16, 185, 129, 0.2);
        }
        .escondido { display: none !important; }
        
        /* Animação do botão de compra (Ativa apenas quando liberado) */
        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .btn-pulse { animation: pulse-btn 2s infinite; }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen items-center py-12 px-4 selection:bg-emerald-500/30">

<script>
  // Função reutilizável para disparo de conversão de checkout/compra
  function dispararConversaoCompra() {
      gtag('event', 'conversion', {
          'send_to': 'AW-18420984078/FZPkCKfelYYdEI7S589E',
          'value': 30.0, 
          'currency': 'BRL',
          'transaction_id': 'PIX_' + new Date().getTime() 
      });
      console.log("Evento de conversão enviado ao Google Ads.");
  }
</script>
    
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5ZXZK2H5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <main class="w-full max-w-4xl flex flex-col items-center">
        
        <!-- Logotipo -->
        <div class="mb-8 flex items-center justify-center gap-3 bg-slate-900/50 backdrop-blur border border-slate-800 px-6 py-2 rounded-2xl shadow-lg">
            <i class="fa-solid fa-bolt text-indigo-500 text-xl"></i>
            <span class="text-lg font-bold tracking-wide text-white">adEasy <span class="text-indigo-400">Hub</span></span>
        </div>

        <!-- Promessa Principal -->
        <div class="text-center mb-8 w-full">
            <div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase mb-6 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Método Validado
            </div>
           
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-extrabold mt-2 mb-4 leading-tight text-white tracking-tight">
                Venda ainda esta noite com o Google <br class="hidden md:block">
                mesmo se não tiver um produto e <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">não souber nada</span> da ferramenta.
            </h1>
        </div>

        <!-- VSL (Vídeo de Vendas) -->
        <div class="w-full max-w-3xl bg-slate-900/80 backdrop-blur-sm border border-slate-700 p-2 rounded-2xl mb-10 glow-effect relative">
            <div class="video-container bg-black rounded-xl ring-1 ring-white/10">
               <iframe src="https://www.youtube.com/embed/BoTAiuEbYrY?autoplay=1&rel=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Botão CTA (Aparece no Pitch após 10s) -->
        <button id="btn-cta" class="escondido btn-pulse w-full max-w-md bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-lg md:text-xl py-4 px-8 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-3 mb-10 border border-emerald-400/50">
            QUERO GARANTIR MEU ACESSO <i class="fa-solid fa-arrow-right"></i>
        </button>

        <!-- Formulário de Checkout Redirecionado -->
        <div id="checkout-area" class="escondido w-full max-w-lg bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden mb-10">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-emerald-400 to-cyan-400"></div>
           
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold text-white mb-2">Liberação Imediata</h2>
                <p class="text-sm text-slate-400">Preencha os seus dados abaixo para ser redirecionado ao pagamento seguro.</p>
            </div>
           
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1 uppercase tracking-wider">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-all placeholder-slate-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1 uppercase tracking-wider">E-mail Principal</label>
                    <input type="email" id="email" placeholder="onde receberá o acesso" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-all placeholder-slate-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 ml-1 uppercase tracking-wider">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-all placeholder-slate-600">
                </div>

                <!-- Desafio Matemático Anti-Bot (Sorteia uma de 5 opções) -->
                <div>
                    <label id="pergunta-matematica" class="block text-xs font-semibold text-slate-400 mb-1 ml-1 uppercase tracking-wider">Verificação de Segurança</label>
                    <input type="number" id="resposta-math" placeholder="Digite a resposta" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-all placeholder-slate-600">
                </div>
               
                <!-- Botão Inicialmente Desativado -->
                <button id="btn-gerar-pix" disabled class="w-full bg-emerald-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mt-2 opacity-50 cursor-not-allowed">
                    <i class="fa-brands fa-pix"></i> IR PARA O CHECKOUT
                </button>
            </div>
        </div>

        <!-- Rodapé de Segurança -->
        <div class="flex flex-wrap items-center justify-center gap-4 text-xs font-medium text-slate-500 pb-10">
            <div class="flex items-center gap-1.5"><i class="fa-solid fa-lock text-slate-400"></i> Ambiente Seguro</div>
            <div class="flex items-center gap-1.5"><i class="fa-solid fa-envelope-open-text text-slate-400"></i> Acesso no E-mail</div>
        </div>

    </main>

    <script>
        // 1. Array com as 5 possibilidades de contas matemáticas simples
        const desafiosMatematicos = [
            { pergunta: "Quanto é 3 + 4?", resposta: 7 },
            { pergunta: "Quanto é 10 - 4?", resposta: 6 },
            { pergunta: "Quanto é 5 x 2?", resposta: 10 },
            { pergunta: "Quanto é 8 + 3?", resposta: 11 },
            { pergunta: "Quanto é 9 - 5?", resposta: 4 }
        ];

        // Sorteia aleatoriamente um dos 5 desafios ao carregar a página
        const desafioAtual = desafiosMatematicos[Math.floor(Math.random() * desafiosMatematicos.length)];
        document.getElementById('pergunta-matematica').innerText = `${desafioAtual.pergunta} (Confirme que é humano)`;

        // Dispara evento de carregamento da VSL
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ 'event': 'vsl_page_load' });

        const tempoDelay = 10000; // 10 segundos para o botão aparecer

        setTimeout(function() {
            document.getElementById('btn-cta').classList.remove('escondido');
            window.dataLayer.push({ 'event': 'vsl_pitch_reached' });
        }, tempoDelay);

        // Ao clicar no CTA principal, esconde o botão e mostra o formulário
        document.getElementById('btn-cta').addEventListener('click', function() {
            this.classList.add('escondido');
            document.getElementById('checkout-area').classList.remove('escondido');
            window.dataLayer.push({ 'event': 'checkout_intent' });
            document.getElementById('checkout-area').scrollIntoView({ behavior: 'smooth' });
        });

        // 2. Validação em Tempo Real (Habilita/Desabilita o botão conforme preenchimento e resposta correta)
        const inputsForm = document.querySelectorAll('#nome, #email, #cpf, #resposta-math');
        const btnGerarPix = document.getElementById('btn-gerar-pix');

        inputsForm.forEach(input => {
            input.addEventListener('input', validarFormularioCompleto);
        });

        function validarFormularioCompleto() {
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const mathVal = parseInt(document.getElementById('resposta-math').value);

            const camposPreenchidos = nome !== '' && email !== '' && cpf !== '' && !isNaN(mathVal);
            const respostaCorreta = mathVal === desafioAtual.resposta;

            if (camposPreenchidos && respostaCorreta) {
                btnGerarPix.removeAttribute('disabled');
                btnGerarPix.classList.remove('opacity-50', 'cursor-not-allowed');
                btnGerarPix.classList.add('btn-pulse', 'hover:bg-emerald-500');
            } else {
                btnGerarPix.setAttribute('disabled', 'true');
                btnGerarPix.classList.add('opacity-50', 'cursor-not-allowed');
                btnGerarPix.classList.remove('btn-pulse', 'hover:bg-emerald-500');
            }
        }

        // 3. Rate Limiting Local e Envio para o Webhook de Checkout
        let emProcessamento = false;

        btnGerarPix.addEventListener('click', function() {
            if (emProcessamento) return; // Bloqueia cliques múltiplos (Spam / Rate Limit local)

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const mathVal = parseInt(document.getElementById('resposta-math').value);

            if (mathVal !== desafioAtual.resposta) {
                alert("A resposta da verificação matemática está incorreta.");
                return;
            }

            emProcessamento = true;
            btnGerarPix.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> A redirecionar...';
            btnGerarPix.classList.add('opacity-80', 'cursor-not-allowed');

            const webhookCheckout = "https://n8n.apps.boulevinco.com.br/webhook/checkout";

            fetch(webhookCheckout, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: nome, email: email, cpf: cpf })
            })
            .then(res => res.json())
            .then(data => {
                if(data.init_point) {
                    // Dispara a conversão de checkout antes do redirecionamento
                    dispararConversaoCompra();

                    window.location.href = data.init_point;
                } else {
                    alert("Erro ao gerar link de pagamento. Tente novamente.");
                    restaurarBotao();
                }
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro ao conectar com o servidor. Tente novamente.");
                restaurarBotao();
            });
        });

        function restaurarBotao() {
            emProcessamento = false;
            btnGerarPix.innerHTML = '<i class="fa-brands fa-pix"></i> IR PARA O CHECKOUT';
            btnGerarPix.classList.remove('opacity-80', 'cursor-not-allowed');
            validarFormularioCompleto();
        }
    </script>

    <script>
        // Webhook de Visitas automático (Mantido isolado)
        const urlParams = new URLSearchParams(window.location.search);
        const utmSource = urlParams.get('utm_source') || 'organico';
        const utmCampaign = urlParams.get('utm_campaign') || 'sem_campanha';
        
        let sessionId = localStorage.getItem('lead_session_id');
        if (!sessionId) {
            sessionId = 'lead_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('lead_session_id', sessionId);
        }

        const webhookVisita = "https://n8n.apps.boulevinco.com.br/webhook/digistore-vendas";
        
        fetch(webhookVisita, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                evento: 'visita_vsl',
                sessao_id: sessionId,
                utm_source: utmSource,
                utm_campaign: utmCampaign,
                status: 'Foi para VSL',
                timestamp: new Date().toISOString()
            })
        }).catch(error => console.error('Erro ao registar lead:', error));
    </script>
    
</body>
</html>
